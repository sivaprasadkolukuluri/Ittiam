<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ittiam Versions</title>
  <link rel="icon" href="hub/ittiam-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap">
  <link rel="stylesheet" href="hub/hub.css?v=4">
</head>
<body>
  <div class="floor" aria-hidden="true"></div>

  <header class="top">
    <img src="hub/ittiam-logo.svg" alt="Ittiam" width="80" height="26">
    <span class="top-sep" aria-hidden="true"></span>
    <span class="top-label">UI design</span>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>VISUAL <span class="chrome">DIRECTIONS</span></h1>
    </section>

    <section aria-labelledby="draft-h">
      <h2 class="section-h" id="draft-h"><span>In progress</span></h2>
      <div data-draft></div>
    </section>

    <div data-directions></div>
  </main>

  <footer class="foot">
    <span class="spectrum" aria-hidden="true"></span>
    <p>To save a new direction, copy the working draft into <code>versions/&lt;name&gt;/</code> and add it to <code>hub/versions.js</code>.</p>
  </footer>

  <script src="hub/versions.js?v=4"></script>
  <script src="hub/hub.js?v=4"></script>
</body>
</html>
